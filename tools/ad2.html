<!doctype html>
<html dir="rtl" lang="he">
<head>
<meta charset="utf-8">
<style>
/*FONT*/
:root{
  --pink:#ff2d8e; --pinkS:#d81b73; --pinkL:#ffe3ef;
  --orange:#ff7a1a; --orangeS:#c95c07;
  --green:#34d399; --greenS:#0c8a5f; --greenL:#d6f2e6;
  --txt:#14121c; --mut:#4f4d5e; --bg:#f9f3f2; --card:#ffffff;
  --mut2:#8b8899; --ground:#f1e8e6; --line:#e6dfe4; --line2:#dcd4da;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--ground)}
body{font-family:'TelAviv','Segoe UI',Arial,sans-serif;-webkit-font-smoothing:antialiased}

.ad{position:relative;width:var(--W);height:var(--H);background:var(--ground);overflow:hidden}

/* מסגרת הקלף. אותה מסגרת של כרטיסיות סיפור הלקוח באתר, ובכוונה: אותה
   הוכחה ואותו מותג לא אמורים להיראות אחרת בשני מקומות. */
.card{position:absolute;inset:var(--cardM);background:var(--bg);
  border:var(--cardB) solid var(--line2);border-radius:var(--cardR);overflow:hidden}
.card::before{content:"";position:absolute;inset:var(--cardI);z-index:3;
  border:var(--cardB) solid var(--line);border-radius:var(--cardIR);pointer-events:none}
.tick{position:absolute;z-index:4;width:var(--tick);height:var(--tick);pointer-events:none}
.tick::before,.tick::after{content:"";position:absolute;background:var(--pink);
  opacity:.45;border-radius:2px}
.tick::before{width:var(--tick);height:var(--tickW)}
.tick::after{width:var(--tickW);height:var(--tick)}
.t1{top:var(--tickO);right:var(--tickO)} .t2{top:var(--tickO);left:var(--tickO)}
.t3{bottom:var(--tickO);right:var(--tickO)} .t4{bottom:var(--tickO);left:var(--tickO)}
.t2::before,.t4::before{right:0} .t3::after,.t4::after{bottom:0}

/* רשת רקע כמעט בלתי נראית, כמו במקור. שתי אחוזי אטימות בכוונה:
   היא נועדה לתת מרקם, לא להיראות. */
.grid{position:absolute;inset:0;pointer-events:none;opacity:.028;
  background-image:
    repeating-linear-gradient(0deg,#000 0 1px,transparent 1px var(--cell)),
    repeating-linear-gradient(90deg,#000 0 1px,transparent 1px var(--cell))}

.inner{position:relative;z-index:2;width:100%;height:100%;
  display:flex;flex-direction:column;align-items:center;text-align:center;
  padding:var(--padT) var(--padX) var(--padB)}

/* תג הקהל. הוא המסנן, ולכן הוא ראשון ולא הלוגו. */
.tag{flex:0 0 auto;font-size:var(--tagF);font-weight:800;color:var(--mut);
  padding:var(--tagP);border-radius:999px;background:var(--card);
  border:var(--tagB) solid transparent;white-space:nowrap;
  background-image:linear-gradient(#fff,#fff),
    linear-gradient(90deg,var(--pink),var(--orange));
  background-origin:border-box;background-clip:padding-box,border-box}

/* כל שורה היא בלוק שלא נשבר. ככה אין מילים יתומות, לעולם. */
/* קופסאות הסימון תופסות גובה, אז השורות צריכות יותר אוויר מטקסט חשוף */
h1{margin-top:var(--gapA);font-size:var(--h1);line-height:1.56;font-weight:800;
  letter-spacing:-.022em;color:var(--txt);flex:0 0 auto}
h1 i{display:block;font-style:normal;white-space:nowrap}
/* קופסת סימון מלאה, בדיוק כמו בקרוסלות ובנכסים: גרדיאנט מלא וטקסט
   הפוך. הגרסה הראשונה כאן הייתה רקע פסטלי עם טקסט כהה, והיא לא עצרה
   את העין בגלילה. מרקר עוצר, גוון בהיר לא. */
.mark{display:inline-block;padding:var(--markP);border-radius:var(--markR);
  line-height:1;white-space:nowrap;vertical-align:baseline}
.mark.p{background:linear-gradient(90deg,#ff2d8e,#ff4d6d);color:#fff;
  box-shadow:0 var(--markSY) var(--markSB) rgba(255,45,142,.28)}
.mark.g{background:linear-gradient(90deg,#10b981,#34d399);color:#04120c;
  box-shadow:0 var(--markSY) var(--markSB) rgba(52,211,153,.25)}

/* גולשת לרוחב המלא, מחוץ לשוליים. הצבה בתוך השוליים יצרה מלבן בהיר
   סביב האובייקט, כי החיתוך נושא איתו את הרקע של המודעה המקורית. */
.art{flex:1 1 auto;display:flex;align-items:center;justify-content:center;
  width:calc(100% + var(--padX) * 2);margin-inline:calc(var(--padX) * -1);
  min-height:0;margin-top:var(--gapB)}
/* ממלאת את הרוחב. אין יותר רקע באמנות, אז אין מה לחשוף. */
.art img{width:100%;height:auto;max-height:100%;object-fit:contain;display:block}

/* שם המוצר. "מפת" כהה, "הדליפה" במעבר ורוד לכתום, בדיוק כמו במקור. */
.name{flex:0 0 auto;margin-top:var(--gapC);font-size:var(--nameF);font-weight:800;
  letter-spacing:-.03em;color:var(--txt);white-space:nowrap}
.name em{font-style:normal;background:linear-gradient(90deg,var(--pink),var(--orange));
  -webkit-background-clip:text;background-clip:text;color:transparent}

/* שם המותג. גל ביקש שהוא יופיע איפשהו, וזה המקום הטבעי: מוצר, ומתחתיו
   מי עומד מאחוריו. שורת קופירייט אינה נדרשת על מודעה. */
.brand{flex:0 0 auto;margin-top:var(--brandGap);font-size:var(--brandF);
  font-weight:800;letter-spacing:.16em;color:var(--mut2);white-space:nowrap}

.spec{flex:0 0 auto;margin-top:var(--gapD);display:flex;align-items:center;
  gap:var(--specGap);background:var(--card);border-radius:999px;padding:var(--specP);
  font-size:var(--specF);font-weight:800;color:var(--txt);white-space:nowrap;
  box-shadow:0 2px 14px rgba(20,18,28,.06)}
.spec b{display:flex;align-items:center;gap:var(--specIG);font-weight:800}
.spec svg{width:var(--specI);height:var(--specI);flex:0 0 auto}
.spec s{width:var(--dot);height:var(--dot);border-radius:50%;text-decoration:none;
  flex:0 0 auto}
.spec s.p{background:var(--pink)} .spec s.g{background:var(--green)}

.cta{flex:0 0 auto;margin-top:var(--gapE);font-size:var(--ctaF);font-weight:800;
  color:#fff;padding:var(--ctaP);border-radius:999px;white-space:nowrap;
  background:linear-gradient(90deg,var(--pink),var(--orange));
  box-shadow:0 var(--ctaSY) var(--ctaSB) rgba(255,45,142,.28)}
</style>
</head>
<body>
<div class="ad">
  <div class="card">
  <i class="grid"></i>
  <i class="tick t1"></i><i class="tick t2"></i><i class="tick t3"></i><i class="tick t4"></i>
  <div class="inner">
    <div class="tag">/*TAG*/</div>
    <h1>/*H1*/</h1>
    <div class="art"><img src="/*ART*/" alt=""></div>
    <div class="name">מפת <em>הדליפה</em></div>
    <div class="brand">דיוק דיגיטלי</div>
    <div class="spec">
      <b><svg viewBox="0 0 24 24" fill="none" stroke="#ff7a1a" stroke-width="2.4"
        stroke-linecap="round"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/>
        </svg>10&nbsp;שאלות</b>
      <s class="g"></s>
      <b><svg viewBox="0 0 24 24" fill="none" stroke="#ff2d8e" stroke-width="2.4"
        stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>
        </svg>4&nbsp;דקות</b>
      <s class="p"></s>
      <b><svg viewBox="0 0 24 24" fill="none" stroke="#0c8a5f" stroke-width="2.4"
        stroke-linecap="round"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="4.5"/>
        <path d="M12 12h.01"/></svg>/*SPEC3*/</b>
    </div>
    <div class="cta">/*CTA*/</div>
  </div>
  </div>
</div>
</body>
</html>
