function openVid(boxId, videoId, src){
  var box = document.getElementById(boxId), v = document.getElementById(videoId);
  if(!v.src) v.src = src;
  box.classList.add('on');
  v.play().catch(function(){});
}
function closeVid(boxId, videoId){
  var box = document.getElementById(boxId), v = document.getElementById(videoId);
  v.pause();
  box.classList.remove('on');
}

});

/* איזה סיפור מוצג. מסלול ממומן מקבל את מי שהגיע עם תנועה קנויה, ומסלול

/* משתמשים בביטוי שלם, לא רק במספר, כי יחיד דורש ניסוח אחר מרבים.
   "שתי" ולא "שתיים" כי הספרה יושבת צמוד ל"נקודות" והצורה הזאת נשמעת. */
function pointsPhrase(n, tail){
  tail = tail || 'האלה';
  if(n === 1) return 'הנקודה ' + (tail === 'האלה' ? 'הזאת' : tail);
  return (n === 2 ? 'שתי' : 'שלוש') + ' הנקודות ' + tail;
}

function render(){
  var t = TEMP[D.temp], lk = leaksFor(D);
  var src = SRC[D.source] || SRC[D.track === 'a' ? 'paid' : (D.track === 'c' ? 'org' : 'ref')];
  var headline = D.track === 'a' ? D.main : (D.extra || D.main);

  document.getElementById('wrap').innerHTML =
  '<div class="top sec"><p class="kicker">מפת הדליפה של <b>' + esc(D.biz) + '</b></p>'+
    '<div class="panel"><i class="tick t1"></i><i class="tick t2"></i><i class="tick t3"></i><i class="tick t4"></i>'+
      '<p class="big">' + money(headline) + '</p><span class="numsub">' + src.lead + '</span>'+
      '<div class="seal"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>'+

    '<div class="vid"><div class="frame"><img src="/*AVATAR*/" alt="גל הרוש">'+
      '<button class="play" aria-label="להפעלת הסרטון" onclick="openVid(\'vlResult\',\'vidResult\',\'/media/result.mp4\')"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg></button>'+
      '</div><p class="vcap">שלוש דקות על המספר שלמעלה, ומה עושים איתו.</p></div></div>'+

  '<div class="calc sec"><h2 class="sh">ככה הגעתי למספר, <span class="boxo">שורה שורה</span></h2>'+
    '<p style="font-size:14px;margin-bottom:14px">אלה הנתונים שסימנת. אפשר לעבור עליהם ולבדוק אותי.</p>'+
    D.rows.map(function(x){ return '<div class="row"><span>'+esc(x[0])+'</span><span>'+esc(x[1])+'</span></div>'; }).join('')+
    '<div class="row tot"><span>' + (D.track === 'b' ? 'קיבולת פנויה בחודש' : 'הולך לאיבוד בחודש') + '</span>'+
      '<span class="totv">' + money(headline) + '</span></div>'+
    (D.track === 'b' && D.main >= 1000
      ? '<div class="row"><span>ומתוך ההכנסה הקיימת, תלוי בהמלצות</span><span>' + money(D.main) + '</span></div>'
      : '')+
    '<p class="note">' + src.note + '</p></div>'+

  '<div class="sec"><h2 class="sh">למה זה קורה <span class="box">דווקא אצלך</span></h2>'+
    '<div class="why"><p>' + src.why + '</p><p>' + WHY[D.aware].replace('{OPEN}', blindOpener(D)) + '</p></div></div>'+

  '<div class="sec"><h2 class="sh"><span class="box">איפה זה נעצר</span>, לפי סדר</h2>'+
    '<p>הנקודות האלה נבחרו מהתשובות שסימנת, לפי סדר הכסף שיושב על כל אחת מהן.</p>'+
    '<div style="margin-top:18px">' + lk.map(function(l,i){
      return '<div class="leak">'+ numeral(i+1, l.k) +'<div><h3>'+l.h+'</h3><p>'+l.t+'</p></div></div>';
    }).join('') + '</div></div>'+

  '<div class="sec card lift"><h2 class="sh">משהו שאפשר לעשות <span class="boxo">כבר מחר בבוקר</span>, בלי אף אחד</h2>'+
    '<p style="margin-bottom:0">' + TOMORROW[D.track] + '</p></div>'+

  '<div class="sec"><h2 class="sh">מי שכבר <span class="boxg">סגר את הנקודות האלה</span></h2>'+
    '<div class="cases">' + caseCard(CASES[PROOF_FOR[D.track] || 0]) + '</div></div>'+

  '<div class="sec invite" id="s-inv"><h2>'+t.h+'</h2>'+
    '<p>'+t.p.replace('{PHRASE}', pointsPhrase(lk.length, 'למעלה')) +
      (D.temp === 'ok' ? '' : ' <b>'+LINE[D.aware].replace('{PHRASE}', pointsPhrase(lk.length))+'</b>') + '</p>'+
    '<p class="fine">אני לא מבטיח תוצאה. <b>אני מתחייב על התהליך</b>, ואם אני חושב שאני לא יכול לעזור לך, אני אגיד לך את זה בפנים.</p>'+
    '<button class="cta'+(D.temp === 'ok' ? ' quiet' : '')+'" onclick="location.href=\'/call/\'">'+t.c+'</button>'+
    '<p class="fine">המפה נשארת שלך גם אם לא נעבוד יחד. שלחתי אותה גם למייל.</p></div>'+

  '<div class="sec card ask"><h2 style="font-size:18px">יש שאלה על המפה?</h2>'+

    '<textarea id="q" placeholder="לדוגמה, מאיפה בדיוק הגיע המספר של זמן התגובה?"></textarea>'+
    '<button class="send" id="qsend">לשליחת השאלה</button></div>'+

  '<footer><p><b>גל הרוש</b> · דיוק דיגיטלי<br>DG-GAL.ONLINE</p>'+
    '<p class="soc">'+
    '<a href="https://www.instagram.com/dg.gal.online" target="_blank" rel="noopener" aria-label="אינסטגרם">'+
      '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="20" height="20" x="2" y="2" rx="5"/>'+

      '<line x1="17.5" x2="17.51" y1="6.5" y2="6.5"/></svg></a>'+
    '<a href="https://www.facebook.com/732380313300100" target="_blank" rel="noopener" aria-label="פייסבוק">'+
      '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 2h-3a5 5 0 0 0-5 5v3H7v4h3v8h4v-8h3l1-4h-4V7a1 1 0 0 1 1-1h3z"/>'+

  '</footer>';

function numeral(n,k){
  var c = k === 'p' ? 'var(--pink)' : (k === 'o' ? 'var(--orange)' : 'var(--green)');
  return '<div style="flex:0 0 auto;width:44px;text-align:center">'+
    '<b style="display:block;font-size:30px;line-height:1;font-weight:800;letter-spacing:-.03em;'+
    'color:transparent;-webkit-text-stroke:1.4px '+c+';opacity:.95">0'+n+'</b>'+
    '<i style="display:block;width:1px;height:26px;margin:9px auto 0;opacity:.5;'+
    'background:linear-gradient(180deg,'+c+',transparent)"></i></div>';
}
/*__CASES__*/

function esc(s){ return String(s == null ? '' : s).replace(/[&<>"]/g, function(c){
  return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'})[c]; }); }

var WORKER_URL = 'https://dg-gal-funnel.tom-harush.workers.dev';

/* מעבר ליומן. המסך נשאר על הדף הזה עד שהיומן מצייר, כי שם הייתה השתיקה
   הארוכה ביותר: גם הדף וגם ה-embed של קאל צריכים להיטען. */
function goCall(){
  if(window.__mark) window.__mark('booking_click');
  if(window.fbq) fbq('trackCustom','ClickBooking');
  var g = document.getElementById('gate');
  if(g) g.classList.add('on');
  setTimeout(function(){ location.href = '/call/' + location.search; }, 120);
}

/* ניסיון חוזר לליד שלא הצליח להישלח בהגשה. רץ בשקט, ולא מציג כלום לאדם
   שקורא את המפה שלו: הכישלון הוא שלנו, לא שלו. */
(function retryPending(){
  var raw = null;
  try { raw = localStorage.getItem('dg_pending_lead'); } catch(e){ return; }
  if(!raw) return;
  fetch(WORKER_URL + '/lead', { method:'POST', headers:{ 'Content-Type':'application/json' },
    body: raw })
    .then(function(res){ return res.ok ? res.json() : null; })
    .then(function(j){
      if(j && j.id){
        try { sessionStorage.setItem('dg_lead_id', j.id);
              localStorage.removeItem('dg_pending_lead'); } catch(e){}
      }
    })
    .catch(function(){});
})();

function sendQuestion(){
  var box = document.getElementById('q');
  var v = box.value.trim();
  var b = document.getElementById('qsend');
  if(v.length < 3){
    box.focus();
    b.textContent = 'צריך עוד כמה מילים';
    setTimeout(function(){ b.textContent = 'לשליחת השאלה'; }, 1800);
    return;
  }
  b.disabled = true; b.textContent = 'שולח...';
  var lid = ''; try { lid = sessionStorage.getItem('dg_lead_id') || mapId() || ''; } catch(e){}
  if(window.__mark) window.__mark('asked');

  fetch(WORKER_URL + '/question', { method:'POST', headers:{ 'Content-Type':'application/json' },
    body: JSON.stringify({ lead_id:lid, question:v, name:D.name, phone:D.phone, email:D.email }) })
    .then(function(res){
      if(!res.ok) throw new Error('failed');
      /* השדה מתנקה רק אחרי אישור מהשרת, ואז מחליפים את התיבה כולה
         באישור קצר. אחרת אדם שולח את אותה שאלה שלוש פעמים. */
      box.value = '';
      var wrap = b.parentNode;
      wrap.innerHTML = '<div class="qok">'
        + '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" '
        + 'stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>'
        + '<div><b>השאלה הגיעה אליי</b>'
        + '<span>אני עונה אישית, בדרך כלל באותו יום.</span></div></div>';
    })
    .catch(function(){
      b.disabled = false;
      b.textContent = 'לא נשלח. אפשר לנסות שוב';
    });
}

var fl = document.getElementById('float');
window.addEventListener('scroll', function(){
  if(!D || fl.dataset.allow === '0'){ fl.classList.remove('on'); return; }
  var inv = document.getElementById('s-inv'); if(!inv) return;
  var r = inv.getBoundingClientRect();
  fl.classList.toggle('on', window.scrollY > 420 && r.top > window.innerHeight);
}, { passive:true });


/* ── מה קרה בדף ──────────────────────────────────────────────────────
   שתי אוטומציות תלויות בזה: מי צפה בסרטון ולא קבע, ומי נטש תוך פחות מדקה
   בלי לצפות בכלל. הדיווח נשלח פעם אחת ביציאה, ב-sendBeacon כדי שהוא ישרוד
   גם סגירת לשונית, ובלי לעכב את המשתמש בכלום.                            */
document.addEventListener('click', function(e){
  /* עד שייכנס הסרטון האמיתי, לחיצה על ההפעלה היא הסימן שנצפה. אחר כך
     נחליף את זה במדידת שניות צפייה מתוך אלמנט הווידאו עצמו. */
  if(e.target.closest && e.target.closest('.play') && window.__mark) window.__mark('video');
});

/*__TRACK__*/

/* מנסים קודם את הלשונית, ואם אין, מושכים את המפה לפי המזהה שבקישור */
(function start(){
  if(D){ boot(); return; }
  var id = mapId();
  if(!id){ D = DEMO_MAP; boot(); return; }
  var w = document.getElementById('wrap');
  if(w) w.innerHTML = '<div class="empty"><p>טוענים את המפה שלך.</p></div>';
  fetch(WORKER_URL + '/m/' + id)
    .then(function(res){ return res.ok ? res.json() : null; })
    .then(function(j){
      if(j && j.map){
        D = j.map;
        try { sessionStorage.setItem('dg_map', JSON.stringify(D)); } catch(e){}
      }
      boot();
    })
    .catch(function(){ boot(); });
})();   /* אחרי שכל הקבועים הוגדרו, לא לפני */
</script>
