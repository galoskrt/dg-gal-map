:root{
  --bg:#ffffff; --bg2:#f8f7fb; --bg3:#fcfbfe;
  --pink:#ff2d8e; --pinkS:#d81b73; --pinkT:#fff2f8; --pinkL:#ffe3ef;
  --orange:#ff7a1a; --orangeS:#c95c07; --orangeT:#fff6ee; --orangeL:#ffe7d2;
  --green:#34d399; --greenS:#0c8a5f; --greenT:#eefaf4; --greenL:#d6f2e6;
  --txt:#14121c; --mut:#4f4d5e; --mut2:#8b8899; --line:#ece9f2; --line2:#dfdbe9;
  --sh1:0 1px 2px rgba(20,18,28,.04), 0 4px 10px rgba(20,18,28,.045);
  --sh2:0 1px 2px rgba(20,18,28,.05), 0 8px 20px rgba(20,18,28,.055), 0 22px 44px rgba(20,18,28,.045);
  --shC:0 2px 6px rgba(255,45,142,.18), 0 12px 26px rgba(255,45,142,.24);
  --rC:22px 22px 22px 6px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{overflow-x:clip}
/* כלל ברזל של גל: אין מילים יתומות. text-wrap:pretty נועד בדיוק לזה,
   והדפדפנים שלא תומכים בו פשוט שוברים כרגיל, אז אין מה להפסיד. */
h1,h2,h3,h4,p,li,.res,.pun,.mirror,.sub,.rel,.fine,.qh,.gnote{
  text-wrap:pretty;-webkit-text-wrap:pretty}

body{margin:0;background:var(--bg);color:var(--txt);
  font-family:"TelAviv",system-ui,-apple-system,"Segoe UI",Arial,sans-serif;
  font-size:16px;line-height:1.65;overflow-x:clip;-webkit-font-smoothing:antialiased;
  font-variant-numeric:tabular-nums}
button,input,textarea,select{font-family:inherit;font-variant-numeric:tabular-nums}

.grid{position:fixed;inset:0;z-index:0;pointer-events:none;
  background-image:
    linear-gradient(rgba(20,18,28,.030) 1px,transparent 1px),
    linear-gradient(90deg,rgba(20,18,28,.030) 1px,transparent 1px),
    linear-gradient(rgba(20,18,28,.055) 1px,transparent 1px),
    linear-gradient(90deg,rgba(20,18,28,.055) 1px,transparent 1px);
  background-size:14px 14px,14px 14px,70px 70px,70px 70px;
  -webkit-mask-image:radial-gradient(120% 65% at 50% 0%,#000 0%,rgba(0,0,0,.5) 45%,transparent 82%);
  mask-image:radial-gradient(120% 65% at 50% 0%,#000 0%,rgba(0,0,0,.5) 45%,transparent 82%)}
.glow{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
.glow i{position:absolute;display:block;border-radius:50%;filter:blur(90px)}
.g1{width:340px;height:340px;background:var(--pink);top:-150px;right:-130px;opacity:.11}
.g2{width:300px;height:300px;background:var(--orange);top:42%;left:-150px;opacity:.09}
.g3{width:320px;height:320px;background:var(--green);bottom:3%;right:-140px;opacity:.10}

.wrap{position:relative;z-index:1;max-width:520px;margin:0 auto;padding:0 18px 40px}

header{position:sticky;top:0;z-index:40;backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  background:rgba(255,255,255,.86);border-bottom:1px solid var(--line)}
.hd{max-width:520px;margin:0 auto;padding:9px 18px;display:flex;align-items:center;justify-content:space-between;gap:10px}
.hd img{height:26px;width:auto;display:block}
.hd .who{font-size:11px;color:var(--mut2);font-weight:800;letter-spacing:.06em}

.sec{margin:32px 0;scroll-margin-top:74px}
.sh{font-size:20.5px;line-height:1.5;font-weight:800;margin:0 0 15px;letter-spacing:-.01em;color:var(--txt)}
h2{font-size:22px;line-height:1.32;margin:0 0 10px;font-weight:800;letter-spacing:-.01em}
p{margin:0 0 12px;color:var(--mut)}
b,strong{color:var(--txt);font-weight:800}
.box{display:inline;background:var(--pink);color:#fff;font-weight:800;padding:1px 8px;border-radius:7px;
  box-decoration-break:clone;-webkit-box-decoration-break:clone}
.boxg{display:inline;background:var(--green);color:#05261a;font-weight:800;padding:1px 8px;border-radius:7px;
  box-decoration-break:clone;-webkit-box-decoration-break:clone}
.boxo{display:inline;background:var(--orange);color:#fff;font-weight:800;padding:1px 8px;border-radius:7px;
  box-decoration-break:clone;-webkit-box-decoration-break:clone}
.nb{white-space:nowrap}

.card{position:relative;background:#fff;border:1px solid var(--line);border-radius:var(--rC);
  padding:19px 18px;box-shadow:var(--sh1)}
.card.lift{box-shadow:var(--sh2)}

.panel{position:relative;background:#fff;border:1px solid var(--line2);border-radius:26px 26px 26px 8px;
  padding:26px 20px 22px;box-shadow:var(--sh2);text-align:center;overflow:hidden}
.panel::before{content:"";position:absolute;inset:7px;border:1px solid var(--line);border-radius:20px 20px 20px 5px;pointer-events:none}
.panel .tick{position:absolute;width:13px;height:13px;pointer-events:none}
.panel .tick::before,.panel .tick::after{content:"";position:absolute;background:var(--pink);opacity:.45;border-radius:2px}
.panel .tick::before{width:13px;height:2px}
.panel .tick::after{width:2px;height:13px}
.t1{top:15px;right:15px}.t1::before,.t1::after{top:0;right:0}
.t2{top:15px;left:15px}.t2::before,.t2::after{top:0;left:0}
.t3{bottom:15px;right:15px}.t3::before,.t3::after{bottom:0;right:0}
.t4{bottom:15px;left:15px}.t4::before,.t4::after{bottom:0;left:0}

.puck{position:relative;width:46px;height:46px;flex:0 0 auto;border-radius:15px;display:grid;place-items:center;
  background:linear-gradient(158deg,#fff 0%,var(--pk-t) 58%,var(--pk-l) 100%);
  border:1px solid var(--pk-b);
  box-shadow:inset 0 1.5px 0 rgba(255,255,255,.95), inset 0 -2px 3px rgba(20,18,28,.05),
             0 8px 14px -6px var(--pk-s), 0 2px 5px rgba(20,18,28,.07)}
.puck::before{content:"";position:absolute;top:3px;right:5px;left:9px;height:42%;border-radius:12px 12px 60% 60%;
  background:linear-gradient(180deg,rgba(255,255,255,.85),rgba(255,255,255,0));pointer-events:none}
.puck svg{width:23px;height:23px;position:relative;overflow:visible;
  filter:drop-shadow(0 1.5px 1px rgba(20,18,28,.18))}
.pk-p{--pk-t:var(--pinkT);--pk-l:var(--pinkL);--pk-b:#ffc9de;--pk-s:rgba(255,45,142,.42);color:var(--pinkS)}
.pk-o{--pk-t:var(--orangeT);--pk-l:var(--orangeL);--pk-b:#ffd0a8;--pk-s:rgba(255,122,26,.42);color:var(--orangeS)}
.pk-g{--pk-t:var(--greenT);--pk-l:var(--greenL);--pk-b:#a9e6cb;--pk-s:rgba(52,211,153,.45);color:var(--greenS)}

.cta{display:block;width:100%;border:0;cursor:pointer;color:#fff;font-size:17px;font-weight:800;
  padding:16px 18px;border-radius:999px;background:linear-gradient(96deg,var(--pink),var(--orange));
  box-shadow:var(--shC);
  /* בלי אנימציה, בלי nowrap ובלי שכבת compositing. כל אחד מהשלושה גרם
     לספארי באייפון לחתוך את הכיתוב, ואז נראה רק אמצע המילים. */
  line-height:1.25;text-align:center;overflow:visible}
.cta:disabled{background:#efedf4;color:#a9a5b6;box-shadow:none;cursor:default}
.cta.quiet{background:#fff;border:1px solid var(--line2);color:var(--mut);box-shadow:var(--sh1);font-size:15px}
.fine{font-size:12.5px;color:var(--mut2);margin:12px 0 0}

footer{border-top:1px solid var(--line);margin-top:36px;padding:19px 0 22px;text-align:center;font-size:12.5px;color:var(--mut2)}
footer a{color:var(--mut2)}

/* מסך מעבר. שתיים שלוש שניות של שקט אחרי לחיצה הן המקום שבו אנשים עוזבים,
   אז אומרים להם מה קורה במקום להשאיר מסך ריק. */
.gate{position:fixed;inset:0;z-index:120;display:none;place-content:center;
  background:rgba(20,18,28,.62);backdrop-filter:blur(3px);
  -webkit-backdrop-filter:blur(3px);opacity:0;transition:opacity .22s ease}
.gate.on{display:grid;opacity:1}
.gate .g{text-align:center;padding:0 30px}
.gate .ring{width:46px;height:46px;margin:0 auto 16px;border-radius:50%;
  border:3px solid rgba(255,255,255,.22);border-top-color:#fff;
  animation:gspin .8s linear infinite}
@keyframes gspin{to{transform:rotate(360deg)}}
.gate p{margin:0;color:#fff;font-size:16.5px;font-weight:800;line-height:1.5}
.gate small{display:block;margin-top:7px;color:rgba(255,255,255,.7);
  font-size:13.5px;font-weight:700}

.cr{margin-top:10px!important;font-size:11.5px;color:var(--mut2);opacity:.85}

.top{padding:24px 0 0}
.kicker{font-size:12.5px;color:var(--mut2);font-weight:700;margin:0 0 10px;text-align:center}
.big{font-size:clamp(30px,8.6vw,46px);line-height:1.1;font-weight:800;margin:0;letter-spacing:-.025em;white-space:nowrap;
  background:linear-gradient(96deg,var(--pink) 0%,var(--orange) 100%);
  -webkit-background-clip:text;background-clip:text;color:transparent}
.numsub{display:block;font-size:15px;color:var(--mut);font-weight:700;margin:9px 0 0}
.seal{display:flex;align-items:center;justify-content:center;gap:7px;margin:15px 0 0;padding-top:13px;
  border-top:1px dashed var(--line2);font-size:11.5px;color:var(--mut2);font-weight:700}
.seal svg{width:14px;height:14px;stroke-width:2.4;color:var(--greenS);flex:0 0 auto}
.under{font-size:14px;color:var(--mut);margin:16px auto 0;max-width:440px;text-align:center}
.vid{position:relative;margin:0 auto;max-width:100%}
.frame{position:relative;aspect-ratio:16/9;border-radius:26px 26px 26px 8px;overflow:hidden;
  border:1px solid var(--line2);box-shadow:var(--sh2);
  background:linear-gradient(168deg,#fff 0%,var(--pinkT) 42%,var(--orangeT) 100%)}
.frame::after{content:"";position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(90% 55% at 50% 118%,rgba(20,18,28,.30),transparent 62%)}
.frame img{position:absolute;bottom:0;right:7%;left:auto;transform:none;
  height:94%;width:auto;max-width:none;display:block}
.play{position:absolute;z-index:2;top:50%;left:50%;transform:translate(-50%,-50%);
  width:66px;height:66px;border-radius:50%;border:0;cursor:pointer;display:grid;place-items:center;
  background:linear-gradient(96deg,var(--pink),var(--orange));box-shadow:var(--shC),0 0 0 8px rgba(255,255,255,.30)}
.play svg{width:24px;height:24px;color:#fff;margin-right:3px}
.vcap{font-size:13px;color:var(--mut2);text-align:center;margin:13px 0 0;font-weight:700}
.calc{margin-top:20px;background:var(--bg2);border:1px solid var(--line);border-radius:var(--rC);
  padding:17px 17px 7px;box-shadow:var(--sh1)}
.calc .row{display:flex;justify-content:space-between;gap:12px;padding:9px 0;font-size:14px;
  border-bottom:1px dashed #dcd8e8}
.calc .row:last-of-type{border-bottom:0}
.calc .row span:first-child{color:var(--mut2)}
.calc .row span:last-child{font-weight:800;color:var(--txt)}
.calc .row.tot{border-top:2px solid var(--pinkL);border-bottom:0;margin-top:4px;padding-top:13px}
.calc .row.tot span:first-child{color:var(--txt);font-weight:800}
.calc .row.tot .totv{font-size:18px;color:var(--pinkS)}
.calc .note{font-size:12.5px;color:var(--mut2);padding:11px 0 12px;line-height:1.65}
.why{position:relative;border-radius:var(--rC);padding:20px 18px;border:1px solid #ffd4e6;background:var(--pinkT);
  box-shadow:var(--sh1);overflow:hidden}
.why::before{content:"";position:absolute;top:0;right:0;width:3px;height:100%;
  background:linear-gradient(180deg,var(--pink),rgba(255,45,142,.25))}
.why p:last-child{margin-bottom:0}
.leak{display:flex;gap:14px;align-items:flex-start;margin-bottom:14px;background:#fff;
  border:1px solid var(--line);border-radius:var(--rC);padding:16px 15px;box-shadow:var(--sh1)}
.leak h3{margin:0 0 5px;font-size:17px;font-weight:800;letter-spacing:-.01em}
.leak p{margin:0;font-size:14.5px}
.leak .worth{display:inline-block;margin-top:10px;font-size:12.5px;font-weight:800;color:var(--greenS);
  background:var(--greenT);border:1px solid var(--greenL);border-radius:999px;padding:5px 12px}
.proof{position:relative;overflow:hidden;padding-bottom:0}
.proof .in{padding-bottom:6px}
.proof .av{display:block;width:132px;margin:8px 0 -1px auto}
.proof .nm{display:flex;align-items:center;gap:9px;font-size:13px;font-weight:800;color:var(--pinkS);margin:0 0 9px}
.proof .nm i{display:block;width:24px;height:24px;border-radius:50%;flex:0 0 auto;
  background:linear-gradient(158deg,#fff,var(--pinkL));border:1px solid #ffc9de;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.9),0 2px 5px rgba(20,18,28,.07)}
.invite{position:relative;text-align:center;border:1px solid var(--greenL);background:var(--greenT);
  border-radius:30px 30px 30px 8px;padding:26px 19px;box-shadow:var(--sh2)}
.invite .cta{margin-top:15px}
.ask textarea{width:100%;min-height:88px;resize:vertical;margin-top:11px;color:var(--txt);font-size:15px;
  background:var(--bg3);border:1px solid var(--line);border-radius:16px 16px 16px 5px;padding:12px 13px}
.ask textarea::placeholder{color:var(--mut2)}
.ask .send{margin-top:10px;width:100%;cursor:pointer;color:var(--txt);font-size:15px;font-weight:800;
  padding:13px;border-radius:999px;background:#fff;border:1px solid var(--line2);box-shadow:var(--sh1)}
.float{position:fixed;left:0;right:0;bottom:0;z-index:45;padding:11px 18px calc(11px + env(safe-area-inset-bottom));
  background:linear-gradient(180deg,rgba(255,255,255,0),rgba(255,255,255,.97) 34%);opacity:0;transform:translateY(100%);
  transition:opacity .28s,transform .28s;pointer-events:none}
.float.on{opacity:1;transform:none;pointer-events:auto}
.float .in{max-width:520px;margin:0 auto}
.float button{width:100%;border:0;cursor:pointer;color:#fff;font-size:16px;font-weight:800;padding:15px;
  border-radius:999px;background:linear-gradient(96deg,var(--pink),var(--orange));box-shadow:var(--shC)}
.empty{text-align:center;padding:60px 0}
</style>

<div class="gate" id="gate"><div class="g"><div class="ring"></div><p>פותחים את היומן</p><small>עוד רגע תוכל לבחור מועד שנוח לך</small></div></div>
<div class="float" id="float"><div class="in"><button onclick="goCall()">לבחירת מועד לשיחת אבחון</button></div></div>

<script>
var D = null;
try { D = JSON.parse(sessionStorage.getItem('dg_map') || 'null'); } catch(e){}

/* מפה נפתחת מקישור, גם ממכשיר אחר וגם בעוד שנה. זה מה שהופך אותה למשהו
   ששייך לאדם ולא לרגע. הזיכרון של הלשונית הוא רק קיצור דרך. */
function mapId(){
  var m = location.search.match(/[?&]id=([\w-]{8,64})/);
  return m ? m[1] : '';
}

function boot(){
  if(!D){
  document.getElementById('wrap').innerHTML =
    '<div class="empty"><h2>המפה לא נמצאה</h2>'+
    '<p>נראה שהדף נפתח בלי לעבור את השאלון, או שהדפדפן ניקה את הנתונים.</p>'+
    '<button class="cta" onclick="location.href=\'/q/\'">למילוי האבחון</button></div>';
    return;
  }
  render();
}

/* הפתיחה של פסקת "לא רואה" חייבת לתאר את מה שבאמת נעשה בשאלון */
function blindOpener(d){
  var u = d.unknown || 0;
  if(u >= 2) return 'בכמה שאלות כאן סימנת שהמספר לא ידוע לך.';
  if(u === 1) return 'בשאלה אחת כאן סימנת שהמספר לא ידוע לך.';
  if(d.approx) return 'על חלק מהמספרים כאן ענית בהערכה ולא במדויק.';
  return 'התשובות כאן מראות שהמספרים עצמם לא נמדדים בשום מקום.';
}

function fmt(n){ return n.toLocaleString('en-US'); }
function money(n){ return n < 1000 ? 'פחות מ-1,000 ₪' : 'בערך ' + fmt(n) + ' ₪'; }

/* ספריית הדליפות. מקור אחד, נשתל גם בשאלון וגם בדף התוצאה בזמן הבנייה,
   כי שני עותקים היו נפרדים עם הזמן והמייל היה מדבר על דליפות אחרות מהדף. */
function leaksFor(d){
  var a = d.answers, out = [];
  if(d.track === 'a'){
    if(a.speed && (a.speed.i === 2 || a.speed.i === 3))
      out.push({k:'p',w:5,h:'זמן תגובה',t:'פנייה שמחכה יום מאבדת את רוב הערך שלה. מי שענה ראשון כבר דיבר איתה.'});
    if(a.followup && a.followup.i === 2)
      out.push({k:'o',w:4,h:'אין מגע שני',t:'רוב העסקאות נסגרות במגע השני או השלישי. מי שלא ענה בפעם הראשונה פשוט נעלם.'});
    if(a.reach && (a.reach.i === 2 || a.reach.i === 3))
      out.push({k:'p',w:5,h:'פנייה שלא מגיעה לשיחה',t:'שולם על הפנייה הזאת במלואה. היא נעצרת עוד לפני שהיה סיכוי.'});
    if(a.close && (a.close.i === 2 || a.close.i === 3))
      out.push({k:'o',w:3,h:'סגירה בשיחה',t:'הפניות מגיעות ולא נסגרות. זו לא בעיית שיווק, וכדאי לדעת את זה לפני שמגדילים תקציב.'});
    if(a.cac && a.cac.i !== 0)
      out.push({k:'g',w:2,h:'המדידה נגמרת בפנייה',t:'יש מספר לפנייה. אין מספר לעסקה. וכשזה המצב, חצי מהשיווק מתנהל בחושך.'});
    if(a.followup && a.followup.i === 1)
      out.push({k:'o',w:1,h:'מעקב שתלוי בזיכרון',t:'חזרה ידנית עובדת בימים רגועים, ונשברת בדיוק בימים שבהם נכנסות הכי הרבה פניות.'});
  } else {

  '<div class="calc sec"><h2 class="sh">ככה הגעתי למספר, <span class="boxo">שורה שורה</span></h2>'+
    '<p style="font-size:14px;margin-bottom:14px">אלה הנתונים שסימנת. אפשר לעבור עליהם ולבדוק אותי.</p>'+
    D.rows.map(function(x){ return '<div class="row"><span>'+esc(x[0])+'</span><span>'+esc(x[1])+'</span></div>'; }).join('')+
    '<div class="row tot"><span>' + (D.track === 'a' ? 'הולך לאיבוד בחודש' : 'קיבולת פנויה בחודש') + '</span>'+
      '<span class="totv">' + money(headline) + '</span></div>'+
    (D.track === 'b' && D.main >= 1000
      ? '<div class="row"><span>ומתוך ההכנסה הקיימת, תלוי בהמלצות</span><span>' + money(D.main) + '</span></div>'
      : '')+
    '<p class="note">' + src.note + '</p></div>'+

  '<div class="sec"><h2 class="sh">למה זה קורה <span class="box">דווקא אצלך</span></h2>'+
    '<div class="why"><p>' + src.why + '</p><p>' + WHY[D.aware].replace('{OPEN}', blindOpener(D)) + '</p></div></div>'+

  '<div class="sec"><h2 class="sh"><span class="box">איפה זה נעצר</span>, לפי סדר</h2>'+
    '<p>שלוש הנקודות האלה נבחרו מהתשובות שסימנת, לפי סדר הכסף שיושב על כל אחת מהן.</p>'+
    '<div style="margin-top:18px">' + lk.map(function(l,i){
      return '<div class="leak">'+ numeral(i+1, l.k) +'<div><h3>'+l.h+'</h3><p>'+l.t+'</p></div></div>';
    }).join('') + '</div></div>'+

  '<div class="sec card lift"><h2 class="sh">משהו שאפשר לעשות <span class="boxo">כבר מחר בבוקר</span>, בלי אף אחד</h2>'+

    '<p style="font-size:14px;margin-bottom:0">אפשר לכתוב אותה כאן. <b>אני עונה אישית</b>, בדרך כלל באותו יום.</p>'+
    '<textarea id="q" placeholder="לדוגמה, מאיפה בדיוק הגיע המספר של זמן התגובה?"></textarea>'+
    '<button class="send" id="qsend">לשליחת השאלה</button></div>'+

  '<footer><p><b>גל הרוש</b> · דיוק דיגיטלי<br>DG-GAL.ONLINE</p>'+
    '<p><a href="/privacy/">מדיניות הפרטיות</a></p>'+
    '<p class="cr">© כל הזכויות שמורות · דיוק דיגיטלי · גל הרוש 2026</p>'+
  '</footer>';

  document.getElementById('float').dataset.allow = t.f ? '1' : '0';
  document.getElementById('qsend').addEventListener('click', sendQuestion);
  if(window.fbq) fbq('trackCustom','ViewMap',{ temperature:D.temp, score:D.score });
}

function numeral(n,k){
  var c = k === 'p' ? 'var(--pink)' : (k === 'o' ? 'var(--orange)' : 'var(--green)');
  return '<div style="flex:0 0 auto;width:44px;text-align:center">'+
    '<b style="display:block;font-size:30px;line-height:1;font-weight:800;letter-spacing:-.03em;'+
    'color:transparent;-webkit-text-stroke:1.4px '+c+';opacity:.95">0'+n+'</b>'+
    '<i style="display:block;width:1px;height:26px;margin:9px auto 0;opacity:.5;'+
    'background:linear-gradient(180deg,'+c+',transparent)"></i></div>';
}
function esc(s){ return String(s == null ? '' : s).replace(/[&<>"]/g, function(c){
  return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'})[c]; }); }

var WORKER_URL = 'https://dg-gal-funnel.tom-harush.workers.dev';

/* מעבר ליומן. המסך נשאר על הדף הזה עד שהיומן מצייר, כי שם הייתה השתיקה
   הארוכה ביותר: גם הדף וגם ה-embed של קאל צריכים להיטען. */
function goCall(){
  if(window.fbq) fbq('trackCustom','ClickBooking');
  var g = document.getElementById('gate');
  if(g) g.classList.add('on');
  setTimeout(function(){ location.href = '/call/' + location.search; }, 120);
}

/* ניסיון חוזר לליד שלא הצליח להישלח בהגשה. רץ בשקט, ולא מציג כלום לאדם
   שקורא את המפה שלו: הכישלון הוא שלנו, לא שלו. */
(function retryPending(){
  var raw = null;
  try { raw = localStorage.getItem('dg_pending_lead'); } catch(e){ return; }
  if(!raw) return;
  fetch(WORKER_URL + '/lead', { method:'POST', headers:{ 'Content-Type':'application/json' },
    body: raw })
    .then(function(res){ return res.ok ? res.json() : null; })
    .then(function(j){
      if(j && j.id){
        try { sessionStorage.setItem('dg_lead_id', j.id);
              localStorage.removeItem('dg_pending_lead'); } catch(e){}
      }
    })
    .catch(function(){});
})();

function sendQuestion(){
  var v = document.getElementById('q').value.trim();
  if(v.length < 3) return;
  var b = document.getElementById('qsend');
  b.disabled = true;
  var lid = ''; try { lid = sessionStorage.getItem('dg_lead_id') || ''; } catch(e){}
  /* הכפתור לא מבטיח שנשלח לפני שבאמת נשלח. הבטחה שקרית כאן שורפת את כל האמון שהדף בנה. */
  fetch(WORKER_URL + '/question', { method:'POST', headers:{ 'Content-Type':'application/json' },
    body: JSON.stringify({ lead_id:lid, question:v, name:D.name, phone:D.phone, email:D.email }) })
    .then(function(res){ b.textContent = res.ok ? 'נשלח. אחזור אליך היום' : 'לא נשלח. אפשר לנסות שוב'; 
                         if(!res.ok) b.disabled = false; })
    .catch(function(){ b.textContent = 'לא נשלח. אפשר לנסות שוב'; b.disabled = false; });
}

var fl = document.getElementById('float');
window.addEventListener('scroll', function(){
  if(!D || fl.dataset.allow === '0'){ fl.classList.remove('on'); return; }
  var inv = document.getElementById('s-inv'); if(!inv) return;
  var r = inv.getBoundingClientRect();
  fl.classList.toggle('on', window.scrollY > 420 && r.top > window.innerHeight);
}, { passive:true });

/* מנסים קודם את הלשונית, ואם אין, מושכים את המפה לפי המזהה שבקישור */
(function start(){
  if(D){ boot(); return; }
  var id = mapId();
  if(!id){ boot(); return; }
  var w = document.getElementById('wrap');
  if(w) w.innerHTML = '<div class="empty"><p>טוענים את המפה שלך.</p></div>';
  fetch(WORKER_URL + '/m/' + id)
    .then(function(res){ return res.ok ? res.json() : null; })
    .then(function(j){
      if(j && j.map){
        D = j.map;
        try { sessionStorage.setItem('dg_map', JSON.stringify(D)); } catch(e){}
      }
      boot();
    })
    .catch(function(){ boot(); });
})();   /* אחרי שכל הקבועים הוגדרו, לא לפני */
</script>
</body>
</html>
