body{margin:0;background:var(--bg);color:var(--txt);
  font-family:"TelAviv",system-ui,-apple-system,"Segoe UI",Arial,sans-serif;
  font-size:16px;line-height:1.65;overflow-x:clip;-webkit-font-smoothing:antialiased;
  font-variant-numeric:tabular-nums}
button,input,textarea,select{font-family:inherit;font-variant-numeric:tabular-nums}

.grid{position:fixed;inset:0;z-index:0;pointer-events:none;
  background-image:
    linear-gradient(rgba(20,18,28,.030) 1px,transparent 1px),
    linear-gradient(90deg,rgba(20,18,28,.030) 1px,transparent 1px),
    linear-gradient(rgba(20,18,28,.055) 1px,transparent 1px),
    linear-gradient(90deg,rgba(20,18,28,.055) 1px,transparent 1px);
  background-size:14px 14px,14px 14px,70px 70px,70px 70px;
  -webkit-mask-image:radial-gradient(120% 65% at 50% 0%,#000 0%,rgba(0,0,0,.5) 45%,transparent 82%);
  mask-image:radial-gradient(120% 65% at 50% 0%,#000 0%,rgba(0,0,0,.5) 45%,transparent 82%)}
.glow{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
.glow i{position:absolute;display:block;border-radius:50%;filter:blur(90px)}
.g1{width:340px;height:340px;background:var(--pink);top:-150px;right:-130px;opacity:.11}
.g2{width:300px;height:300px;background:var(--orange);top:42%;left:-150px;opacity:.09}
.g3{width:320px;height:320px;background:var(--green);bottom:3%;right:-140px;opacity:.10}

.wrap{position:relative;z-index:1;max-width:520px;margin:0 auto;padding:0 18px 40px}

header{position:sticky;top:0;z-index:40;backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  background:rgba(255,255,255,.86);border-bottom:1px solid var(--line)}
.hd{max-width:520px;margin:0 auto;padding:9px 18px;display:flex;align-items:center;justify-content:space-between;gap:10px}
.hd img{height:26px;width:auto;display:block}
.hd .who{font-size:11px;color:var(--mut2);font-weight:800;letter-spacing:.06em}

.sec{margin:32px 0;scroll-margin-top:74px}
.sh{font-size:20.5px;line-height:1.5;font-weight:800;margin:0 0 15px;letter-spacing:-.01em;color:var(--txt)}
h2{font-size:22px;line-height:1.32;margin:0 0 10px;font-weight:800;letter-spacing:-.01em}
p{margin:0 0 12px;color:var(--mut)}
b,strong{color:var(--txt);font-weight:800}
.box{display:inline;background:var(--pink);color:#fff;font-weight:800;padding:1px 8px;border-radius:7px;
  box-decoration-break:clone;-webkit-box-decoration-break:clone}
.boxg{display:inline;background:var(--green);color:#05261a;font-weight:800;padding:1px 8px;border-radius:7px;
  box-decoration-break:clone;-webkit-box-decoration-break:clone}
.boxo{display:inline;background:var(--orange);color:#fff;font-weight:800;padding:1px 8px;border-radius:7px;
  box-decoration-break:clone;-webkit-box-decoration-break:clone}
.nb{white-space:nowrap}

.card{position:relative;background:#fff;border:1px solid var(--line);border-radius:var(--rC);
  padding:19px 18px;box-shadow:var(--sh1)}
.card.lift{box-shadow:var(--sh2)}

.panel{position:relative;background:#fff;border:1px solid var(--line2);border-radius:26px 26px 26px 8px;
  padding:26px 20px 22px;box-shadow:var(--sh2);text-align:center;overflow:hidden}
.panel::before{content:"";position:absolute;inset:7px;border:1px solid var(--line);border-radius:20px 20px 20px 5px;pointer-events:none}
.panel .tick{position:absolute;width:13px;height:13px;pointer-events:none}
.panel .tick::before,.panel .tick::after{content:"";position:absolute;background:var(--pink);opacity:.45;border-radius:2px}
.panel .tick::before{width:13px;height:2px}
.panel .tick::after{width:2px;height:13px}
.t1{top:15px;right:15px}.t1::before,.t1::after{top:0;right:0}
.t2{top:15px;left:15px}.t2::before,.t2::after{top:0;left:0}
.t3{bottom:15px;right:15px}.t3::before,.t3::after{bottom:0;right:0}
.t4{bottom:15px;left:15px}.t4::before,.t4::after{bottom:0;left:0}

.puck{position:relative;width:46px;height:46px;flex:0 0 auto;border-radius:15px;display:grid;place-items:center;
  background:linear-gradient(158deg,#fff 0%,var(--pk-t) 58%,var(--pk-l) 100%);
  border:1px solid var(--pk-b);
  box-shadow:inset 0 1.5px 0 rgba(255,255,255,.95), inset 0 -2px 3px rgba(20,18,28,.05),
             0 8px 14px -6px var(--pk-s), 0 2px 5px rgba(20,18,28,.07)}
.puck::before{content:"";position:absolute;top:3px;right:5px;left:9px;height:42%;border-radius:12px 12px 60% 60%;
  background:linear-gradient(180deg,rgba(255,255,255,.85),rgba(255,255,255,0));pointer-events:none}
.puck svg{width:23px;height:23px;position:relative;overflow:visible;
  filter:drop-shadow(0 1.5px 1px rgba(20,18,28,.18))}
.pk-p{--pk-t:var(--pinkT);--pk-l:var(--pinkL);--pk-b:#ffc9de;--pk-s:rgba(255,45,142,.42);color:var(--pinkS)}
.pk-o{--pk-t:var(--orangeT);--pk-l:var(--orangeL);--pk-b:#ffd0a8;--pk-s:rgba(255,122,26,.42);color:var(--orangeS)}
.pk-g{--pk-t:var(--greenT);--pk-l:var(--greenL);--pk-b:#a9e6cb;--pk-s:rgba(52,211,153,.45);color:var(--greenS)}

.cta{display:block;width:100%;border:0;cursor:pointer;color:#fff;font-size:17px;font-weight:800;
  padding:16px 18px;border-radius:999px;background:linear-gradient(96deg,var(--pink),var(--orange));
  box-shadow:var(--shC);animation:bob 3.4s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
.cta:disabled{background:#efedf4;color:#a9a5b6;box-shadow:none;animation:none;cursor:default}
.cta.quiet{background:#fff;border:1px solid var(--line2);color:var(--mut);box-shadow:var(--sh1);animation:none;font-size:15px}
.fine{font-size:12.5px;color:var(--mut2);margin:12px 0 0}

footer{border-top:1px solid var(--line);margin-top:36px;padding:19px 0 22px;text-align:center;font-size:12.5px;color:var(--mut2)}
footer a{color:var(--mut2)}

.chapters{display:flex;gap:6px;margin:20px 0 22px}
.chapters div{flex:1;text-align:center;font-size:10.5px;font-weight:800;color:var(--mut2);line-height:1.3}
.chapters div span{display:block;height:4px;border-radius:999px;background:var(--line2);margin-bottom:7px;transition:background .3s}
.chapters div.on{color:var(--pinkS)}
.chapters div.on span{background:linear-gradient(90deg,var(--pink),var(--orange))}
.chapters div.done span{background:var(--green)}
.qn{font-size:11.5px;font-weight:800;color:var(--mut2);letter-spacing:.05em;margin:0 0 7px}
.qh{font-size:25px;line-height:1.28;font-weight:800;margin:0 0 20px;letter-spacing:-.015em}
.opt{display:flex;gap:13px;align-items:center;width:100%;text-align:right;cursor:pointer;margin-bottom:11px;
  background:#fff;border:1px solid var(--line);border-radius:var(--rC);padding:14px 15px;box-shadow:var(--sh1);
  transition:border-color .16s,box-shadow .16s,transform .16s}
.opt:hover{transform:translateY(-1px);box-shadow:var(--sh2)}
.opt .tx{flex:1;min-width:0}
.opt .tt{font-size:16.5px;font-weight:800;color:var(--txt);line-height:1.35}
.opt .mc{font-size:13px;font-weight:700;color:var(--mut2);margin-top:3px;line-height:1.45}
.opt.sel{border-color:var(--pink);box-shadow:0 0 0 3px var(--pinkL),var(--sh2)}
.opt.sel .mc{color:var(--pinkS)}
.qnav{display:flex;gap:10px;margin-top:20px}
.qnav .back{cursor:pointer;font-size:15px;font-weight:800;color:var(--mut);padding:15px 20px;
  border-radius:999px;background:#fff;border:1px solid var(--line2)}
.qnav .cta{flex:1;margin:0;min-width:0;animation:none;transform:translateZ(0);
  white-space:nowrap;font-size:clamp(15px,4.2vw,17px)}
.qfoot{margin-top:16px;font-size:12px;color:var(--mut2);text-align:center;font-weight:700}
.fld{margin-bottom:13px}
.fld label{display:block;font-size:13px;font-weight:800;color:var(--txt);margin-bottom:5px}
.fld input{width:100%;font-size:16px;color:var(--txt);background:var(--bg3);
  border:1px solid var(--line);border-radius:16px 16px 16px 5px;padding:13px 14px}
.fld input:focus{outline:0;border-color:var(--pink);box-shadow:0 0 0 3px var(--pinkL)}
.fld .err{font-size:12px;font-weight:700;color:var(--pinkS);margin-top:5px;display:none}
.fld.bad input{border-color:var(--pink)}
.fld.bad .err{display:block}
.consent{display:flex;gap:9px;align-items:flex-start;font-size:12.5px;color:var(--mut2);
  font-weight:700;margin:14px 0 4px;line-height:1.5}
.consent input{width:18px;height:18px;flex:0 0 auto;margin-top:2px;accent-color:var(--pink)}
.consent a{color:var(--pinkS)}
.load{position:fixed;inset:0;z-index:80;display:none;align-items:center;justify-content:center;padding:26px;
  background:rgba(11,9,18,.80);backdrop-filter:blur(7px) saturate(.85);
  -webkit-backdrop-filter:blur(7px) saturate(.85);animation:dim .38s ease-out}
@keyframes dim{from{opacity:0}to{opacity:1}}
.load.on{display:flex}
.load.out{animation:undim .42s ease-in forwards}
@keyframes undim{to{opacity:0}}
.load .aur{position:absolute;border-radius:50%;filter:blur(90px);pointer-events:none}
.load .a1{width:300px;height:300px;background:#ff2d8e;top:-90px;right:-90px;opacity:.22;animation:drift 7s ease-in-out infinite}
.load .a2{width:280px;height:280px;background:#ff7a1a;bottom:-90px;left:-90px;opacity:.18;animation:drift 9s ease-in-out infinite reverse}
@keyframes drift{0%,100%{transform:translate3d(0,0,0)}50%{transform:translate3d(-18px,22px,0)}}
.load .in{position:relative;z-index:2;width:min(360px,100%);margin:0 auto;text-align:center}
.load .ring{position:relative;width:126px;height:126px;margin:0 auto 24px}
.load .ring::before{content:"";position:absolute;inset:-16px;border-radius:50%;
  background:conic-gradient(from 0deg,rgba(255,45,142,0),rgba(255,45,142,.55),rgba(255,122,26,.55),rgba(255,45,142,0));
  filter:blur(16px);animation:spin 2.6s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.load .ring svg{position:relative;width:126px;height:126px;transform:rotate(-90deg)}
.load .ring .tr{fill:none;stroke:rgba(255,255,255,.13);stroke-width:7}
.load .ring .vl{fill:none;stroke:url(#lg);stroke-width:7;stroke-linecap:round;
  stroke-dasharray:326;stroke-dashoffset:326;transition:stroke-dashoffset .88s linear}
.load .ring b{position:absolute;inset:0;display:grid;place-items:center;font-size:26px;font-weight:800;
  letter-spacing:-.02em;color:#fff}
.load h3{font-size:24px;font-weight:800;margin:0 0 8px;letter-spacing:-.015em;color:#fff}
.load .sb{font-size:13.5px;color:#9b98ac;font-weight:700;margin:0 0 26px}
.load ul{list-style:none;padding:0 4px;margin:0;text-align:right}
.load li{display:flex;align-items:center;gap:12px;padding:9px 0;font-size:15px;font-weight:700;
  color:#9b98ac;opacity:.38;transform:translateY(5px);transition:opacity .34s,color .34s,transform .34s}
.load li .mk{width:23px;height:23px;flex:0 0 auto;border-radius:50%;border:2px solid rgba(255,255,255,.2);
  display:grid;place-items:center;transition:border-color .3s,background .3s,box-shadow .3s}
.load li .mk svg{width:12px;height:12px;color:#05261a;opacity:0;transition:opacity .25s}
.load li.act{opacity:1;color:#fff;transform:none}
.load li.act .mk{border-color:#ff2d8e;box-shadow:0 0 0 5px rgba(255,45,142,.16)}
.load li.ok{opacity:1;color:#fff;transform:none}
.load li.ok .mk{border-color:#34d399;background:#34d399;box-shadow:none}
.load li.ok .mk svg{opacity:1}
</style>

  var r = 8.8, s = -Math.PI/2, e = s + 2*Math.PI*v;

}

function normPhone(v){ return String(v||'').replace(/[^0-9]/g,''); }
function okPhone(v){ var p = normPhone(v); return /^0(5[0-9]|[2-489])[0-9]{7}$/.test(p); }
function okMail(v){ return /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(String(v||'').trim()); }

/* ============ חישוב ============ */
function roundDown(n){
  if(n >= 100000) return Math.floor(n/10000)*10000;
  if(n >= 20000)  return Math.floor(n/5000)*5000;
  if(n >= 5000)   return Math.floor(n/1000)*1000;
  return Math.floor(n/500)*500;
}
function fmt(n){ return n.toLocaleString('en-US'); }

function compute(){
  var a = S.a, score = 0, blind = 0, burn = false;
  Object.keys(a).forEach(function(k){ score += (a[k].score || 0); });

  if(S.track === 'a'){
    if(a.reach && a.reach.i === 3) blind++;
    if(a.close && a.close.i === 3) blind++;
    if(a.speed && a.speed.i === 3) blind++;
    if(a.cac){ blind += a.cac.val; }
    if(a.budget && a.budget.i > 0 && a.close && a.close.i === 2) burn = true;
  } else {
    if(a.refer && a.refer.i === 0) blind++;
    if(a.dry) blind += a.dry.val;
    if(a.offer) blind += a.offer.val;
    if(a.cac) blind += a.cac.val;
    if(a.tried && (a.tried.i === 1 || a.tried.i === 2)) burn = true;
  }

  /* כמה פעמים באמת נבחרה תשובה שאומרת "לא יודע", להבדיל מתשובה שרק מלמדת על עיוורון */
  var unknown = 0;
  if(S.track === 'a'){
    if(a.reach && a.reach.i === 3) unknown++;   /* לא ידוע לי */
    if(a.close && a.close.i === 3) unknown++;   /* לא ידוע לי */
    if(a.cac   && a.cac.i   === 3) unknown++;   /* לא */
  } else {
    if(a.cac && a.cac.i === 2) unknown++;       /* לא חשבנו על זה ככה */
  }
  var approx = 0;
  if(S.track === 'a' && a.cac && (a.cac.i === 1 || a.cac.i === 2)) approx++;  /* בערך / רק פנייה */

  var aware = burn ? 'burned' : (blind >= 3 ? 'blind' : 'sees');
  var temp  = score >= 15 ? 'hot' : (score >= 9 ? 'warm' : 'ok');

  var main = 0, extra = 0, rows = [];
  if(S.track === 'a'){
    var leads = a.leads.val, notReach = a.reach.val, close = a.close.val, val = a.value.val;
    var rescue = Math.max(0.10, (a.speed.val || 0.40) + (a.followup.val || 0));
    main = roundDown(leads * notReach * rescue * close * val);
    rows = [
      ['פניות חדשות בחודש', a.leads.label],
      ['לא מגיעות לשיחה', a.reach.label],
      ['זמן חזרה לפנייה', a.speed.label],
      ['מעקב למי שלא ענה', a.followup.label],
      ['סגירה מתוך השיחות', a.close.label],
      ['שווי לקוח בשנה הראשונה', a.value.label]
    ];
  } else {
    main  = roundDown(a.clients.val * a.refer.val * a.value.val);
    extra = roundDown(a.capacity.val * a.value.val);
    rows = [
      ['לקוחות חדשים בחודש', a.clients.label],
      ['מתוכם מהמלצה או היכרות', a.refer.label],
      ['שווי לקוח בשנה הראשונה', a.value.label],
      ['אפשר לקחת מחר עוד', a.capacity.label],
      ['בחודש שההפניות מתייבשות', a.dry.label],
      ['הצעה מנוסחת וקבועה', a.offer.label]
    ];
  }
  return { track:S.track, source:S.source, score:score, temp:temp, aware:aware, blind:blind, burn:burn, unknown:unknown, approx:approx,
           main:main, extra:extra, rows:rows, answers:a };
}

  if(d.track === 'a'){
    if(a.speed && (a.speed.i === 2 || a.speed.i === 3))
      out.push({k:'p',w:5,h:'זמן תגובה',t:'פנייה שמחכה יום מאבדת את רוב הערך שלה. מי שענה ראשון כבר דיבר איתה.'});
    if(a.followup && a.followup.i === 2)
      out.push({k:'o',w:4,h:'אין מגע שני',t:'רוב העסקאות נסגרות במגע השני או השלישי. מי שלא ענה בפעם הראשונה פשוט נעלם.'});
    if(a.reach && (a.reach.i === 2 || a.reach.i === 3))
      out.push({k:'p',w:5,h:'פנייה שלא מגיעה לשיחה',t:'שולם על הפנייה הזאת במלואה. היא נעצרת עוד לפני שהיה סיכוי.'});
    if(a.close && (a.close.i === 2 || a.close.i === 3))
      out.push({k:'o',w:3,h:'סגירה בשיחה',t:'הפניות מגיעות ולא נסגרות. זו לא בעיית שיווק, וכדאי לדעת את זה לפני שמגדילים תקציב.'});
    if(a.cac && a.cac.i !== 0)
      out.push({k:'g',w:2,h:'המדידה נגמרת בפנייה',t:'יש מספר לפנייה. אין מספר לעסקה. וכשזה המצב, חצי מהשיווק מתנהל בחושך.'});
    if(a.followup && a.followup.i === 1)
      out.push({k:'o',w:1,h:'מעקב שתלוי בזיכרון',t:'חזרה ידנית עובדת בימים רגועים, ונשברת בדיוק בימים שבהם נכנסות הכי הרבה פניות.'});
  } else {
    if(a.refer && (a.refer.i === 0 || a.refer.i === 1))
      out.push({k:'p',w:5,h:'תלות בהפניות',t:'ההכנסה של החודש תלויה במי שיזכור להמליץ. אי אפשר לתכנן לפי זה.'});
    if(a.capacity && (a.capacity.i === 2 || a.capacity.i === 3))
      out.push({k:'o',w:4,h:'קיבולת שיושבת ריקה',t:'העסק כבר בנוי לקלוט יותר ממה שהוא מקבל. הפער הזה הוא רווח שיושב ולא זז.'});
    if(a.offer && a.offer.i !== 0)
      out.push({k:'g',w:3,h:'הצעה לא מנוסחת',t:'כשכל שיחה יוצאת אחרת, אי אפשר לשכפל הצלחה. וגם מבחינתך, כל שיחה מתחילה מאפס.'});
    if(a.dry && a.dry.i === 2)
      out.push({k:'p',w:4,h:'אין ערוץ גיבוי',t:'בחודש שההפניות מתייבשות אין ברז שאפשר לפתוח, וזה בדיוק החודש שהכי קשה לתכנן אחריו.'});
    if(a.cac && a.cac.i !== 0)
      out.push({k:'g',w:2,h:'עלות לקוח לא ידועה',t:'גם לקוח שהגיע מהמלצה עלה משהו, בזמן ובמקום ביומן. בלי המספר הזה אין למה להשוות.'});
  }
  return out.sort(function(x,y){ return y.w - x.w; }).slice(0,3);
}


function submit(){
  var name = el('i-name').value.trim(), biz = el('i-biz').value.trim();
  var phone = el('i-phone').value.trim(), mail = el('i-mail').value.trim();
  var ok = true;
  ok = mark('f-name', name.length >= 2) && ok;
  ok = mark('f-biz',  biz.length  >= 2) && ok;
  ok = mark('f-phone', okPhone(phone))  && ok;
  ok = mark('f-mail',  okMail(mail))    && ok;
  if(!ok){ return; }

  var r = compute();
  r.name = name; r.biz = biz; r.phone = normPhone(phone); r.email = mail;
  r.consent = el('i-ok').checked;
  r.ts = new Date().toISOString();
  r.utm = {};
  new URLSearchParams(location.search).forEach(function(v,k){ if(/^utm_|^fbclid$|^ad_id$/.test(k)) r.utm[k] = v; });
  try { sessionStorage.setItem('dg_map', JSON.stringify(r)); } catch(e){}

  /* מבנה המטען הוא חוזה עם הוורקר. שינוי כאן בלי שינוי שם שובר את המייל בשקט. */
  var head = (r.track === 'b') ? (r.extra || r.main) : r.main;
  var qlist = qs(), pairs = [];
  for(var qi = 0; qi < qlist.length; qi++){
    var ans = r.answers[qlist[qi].k];
    if(ans) pairs.push({ q: qlist[qi].q, a: ans.label });
  }
  var payload = {
    name: name, phone: r.phone, email: mail, business: biz,
    ref_url: location.href,
    utm: { campaign: r.utm.utm_campaign || '', adset: r.utm.utm_content || '', ad: r.utm.utm_term || '' },
    map: { main: head, source: r.source, awareness: r.aware, temp: r.temp, score: r.score,
           leaks: leaksFor(r).map(function(l){ return { h:l.h, t:l.t }; }), answers: pairs }
  };
  if(WORKER_URL){
    try {
      fetch(WORKER_URL + '/lead', { method:'POST', headers:{ 'Content-Type':'application/json' },
        body: JSON.stringify(payload) })
        .then(function(res){ return res.json(); })
        .then(function(j){ if(j && j.id) try { sessionStorage.setItem('dg_lead_id', j.id); } catch(e){} })
        .catch(function(){});
    } catch(e){}
  }
  if(window.fbq){ fbq('trackCustom','CompleteDiagnostic',{ temperature:r.temp, score:r.score }); }

  runLoad(function(){ location.href = '/map/'; });
}


render();
</script>
